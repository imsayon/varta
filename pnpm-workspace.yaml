packages:
  - client
  - server

saveExact: true
sharedWorkspaceLockfile: true
frozenLockfile: true
engineStrict: true
strictPeerDependencies: true
disallowWorkspaceCycles: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
blockExoticSubdeps: true

overrides:
  'nanoid@3.3.17': 3.3.18

allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
