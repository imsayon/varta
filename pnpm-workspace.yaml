packages:
  - client
  - server

saveExact: true
sharedWorkspaceLockfile: true
frozenLockfile: true
engineStrict: true
strictPeerDependencies: true
disallowWorkspaceCycles: true
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
blockExoticSubdeps: true

overrides:
  'mysql2@<3.23.1': 3.23.1
  'qs@<6.16.0': 6.16.0
  'fast-uri@<3.1.6': 3.1.6
  'deepmerge-ts@<8.0.0': 8.0.2
  'nanoid@3.3.17': 3.3.18
  sharp: 0.35.4

allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
