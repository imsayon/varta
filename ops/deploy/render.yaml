projects:
    - name: Varta Public Beta
      environments:
          - name: Varta Public Beta
            permissions:
                protection: enabled
            services:
                - type: keyvalue
                  name: varta-valkey
                  plan: free
                  region: singapore
                  ipAllowList: []
                  maxmemoryPolicy: noeviction
                  persistenceMode: off

                - type: web
                  name: varta-api
                  runtime: node
                  repo: https://github.com/imsayon/varta
                  branch: main
                  autoDeployTrigger: off
                  region: singapore
                  plan: free
                  buildCommand: corepack pnpm@11.20.0 install --frozen-lockfile && corepack pnpm@11.20.0 --filter @varta/server prisma:generate && corepack pnpm@11.20.0 --filter @varta/server build
                  startCommand: corepack pnpm@11.20.0 --filter @varta/server start:combined
                  healthCheckPath: /api/health/combined/ready
                  envVars:
                      - key: NODE_VERSION
                        value: 24.22.2
                      - key: NODE_ENV
                        value: production
                      - key: PORT
                        value: "10000"
                      - key: SERVICE_NAME
                        value: varta-api-combined
                      - key: LOG_LEVEL
                        value: info
                      - key: LOG_DEBUG_ENABLED
                        value: "false"
                      - key: LOG_DEBUG_TTL_SECONDS
                        value: "900"
                      - key: DATABASE_URL
                        sync: false
                      - key: DIRECT_URL
                        sync: false
                      - key: REDIS_URL
                        fromService:
                            type: keyvalue
                            name: varta-valkey
                            property: connectionString
                      - key: REDIS_QUEUE_PREFIX
                        value: varta_public_beta
                      - key: STARTUP_TIMEOUT_MS
                        value: "30000"
                      - key: SHUTDOWN_TIMEOUT_MS
                        value: "10000"
                      - key: JWT_ACCESS_SECRET
                        sync: false
                      - key: JWT_REFRESH_SECRET
                        sync: false
                      - key: JWT_WS_SECRET
                        sync: false
                      - key: JWT_ACCESS_EXPIRES_IN
                        value: 15m
                      - key: JWT_REFRESH_EXPIRES_IN
                        value: 30d
                      - key: CORS_ORIGIN
                        sync: false
                      - key: CLIENT_URL
                        sync: false
                      - key: GITHUB_CLIENT_ID
                        sync: false
                      - key: GITHUB_CLIENT_SECRET
                        sync: false
                      - key: GITHUB_CALLBACK_URL
                        sync: false
                      - key: GOOGLE_CLIENT_ID
                        sync: false
                      - key: GOOGLE_CLIENT_SECRET
                        sync: false
                      - key: GOOGLE_CALLBACK_URL
                        sync: false
                      - key: RESEND_API_KEY
                        sync: false
                      - key: RESEND_WEBHOOK_SECRET
                        sync: false
                      - key: EMAIL_FROM
                        sync: false
                      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
                        value: "15"
                      - key: EMAIL_VERIFY_TOKEN_TTL_HOURS
                        value: "24"
                      - key: AI_ENABLED
                        value: "false"
                      - key: AI_PLATFORM_PROVIDER
                        value: gemini
                      - key: AI_PLATFORM_MODEL
                        value: gemini-3.6-flash
                      - key: AI_PLATFORM_API_KEY
                        sync: false
                      - key: AI_LOG_PROMPT_CONTENT
                        value: "false"
                      - key: AI_SEND_TIME_OPTIMIZATION_ENABLED
                        value: "false"
                      - key: AI_USAGE_TRACKING_ENABLED
                        value: "false"
                      - key: AI_REQUEST_TIMEOUT_MS
                        value: "30000"
                      - key: AI_MAX_RETRIES
                        value: "2"
                      - key: AI_MAX_INPUT_TOKENS
                        value: "12000"
                      - key: AI_MAX_OUTPUT_TOKENS
                        value: "2048"
                      - key: AI_TEMPERATURE
                        value: "0.2"
                      - key: AI_REQUESTS_PER_MINUTE
                        value: "60"
                      - key: AI_MAX_CONCURRENCY
                        value: "4"
                      - key: AI_RATE_LIMIT_WINDOW_SECONDS
                        value: "60"
                      - key: ENCRYPTION_KEY
                        sync: false
                      - key: METRICS_AUTH_TOKEN
                        sync: false
                      - key: OTEL_ENABLED
                        value: "false"
                      - key: OTEL_EXPORTER_OTLP_ENDPOINT
                        value: http://localhost:4318
                      - key: OTEL_EXPORT_TIMEOUT_MS
                        value: "3000"
                      - key: OTEL_SAMPLE_RATIO
                        value: "0.1"
                      - key: RAZORPAY_MODE
                        value: disabled
                      - key: RAZORPAY_KEY_ID
                        sync: false
                      - key: RAZORPAY_KEY_SECRET
                        sync: false
                      - key: RAZORPAY_WEBHOOK_SECRET
                        sync: false
                      - key: RAZORPAY_WEBHOOK_SECRET_PREVIOUS
                        sync: false
                      - key: RAZORPAY_REQUEST_TIMEOUT_MS
                        value: "5000"
                      - key: RAZORPAY_PLUS_PLAN_ID_INR
                        sync: false
                      - key: RAZORPAY_BUSINESS_PLAN_ID_INR
                        sync: false

                - type: web
                  name: varta-client
                  runtime: node
                  repo: https://github.com/imsayon/varta
                  branch: main
                  autoDeployTrigger: off
                  region: singapore
                  plan: free
                  buildCommand: corepack pnpm@11.20.0 install --frozen-lockfile && corepack pnpm@11.20.0 --filter @varta/web build
                  startCommand: corepack pnpm@11.20.0 --filter @varta/web start
                  healthCheckPath: /
                  envVars:
                      - key: NODE_VERSION
                        value: 24.22.2
                      - key: NODE_ENV
                        value: production
                      - key: PORT
                        value: "10000"
                      - key: NEXT_PUBLIC_API_URL
                        sync: false
