global:
    scrape_interval: 15s
    evaluation_interval: 15s

rule_files:
    - /etc/prometheus/alerts.yml

scrape_configs:
    - job_name: varta-api
      metrics_path: /api/metrics
      authorization:
          type: Bearer
          credentials_file: /run/secrets/metrics_auth_token
      static_configs:
          - targets: [api:5000]
    - job_name: varta-worker
      metrics_path: /metrics
      static_configs:
          - targets: [worker:5001]
