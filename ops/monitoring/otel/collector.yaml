receivers:
    otlp:
        protocols:
            http:
                endpoint: 0.0.0.0:4318
            grpc:
                endpoint: 0.0.0.0:4317

processors:
    memory_limiter:
        check_interval: 1s
        limit_mib: 256
    attributes/sanitize:
        actions:
            - key: http.request.header.authorization
              action: delete
            - key: http.request.header.cookie
              action: delete
            - key: url.full
              action: delete
            - key: url.query
              action: delete
            - key: http.url
              action: delete
            - key: http.target
              action: delete
            - key: db.statement
              action: delete
            - key: db.query.text
              action: delete
            - key: gen_ai.prompt
              action: delete
    batch:
        timeout: 2s

exporters:
    debug:
        verbosity: basic
    otlp/jaeger:
        endpoint: jaeger:4317
        tls:
            insecure: true

service:
    pipelines:
        traces:
            receivers: [otlp]
            processors: [memory_limiter, attributes/sanitize, batch]
            exporters: [otlp/jaeger, debug]
