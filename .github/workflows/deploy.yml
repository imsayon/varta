name: Render release control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Release operation
        required: true
        type: choice
        options: [deploy, rollback]
      release_sha:
        description: Full 40-character main commit SHA to deploy
        required: false
        type: string
      api_deploy_id:
        description: Retained API deploy ID for rollback
        required: false
        type: string
      client_deploy_id:
        description: Retained client deploy ID for rollback
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: varta-public-beta-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: varta-public-beta
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_sha || 'main' }}
          fetch-depth: 0

      - name: Validate deploy request and exact source
        id: release
        env:
          OPERATION: ${{ inputs.operation }}
          REQUESTED_SHA: ${{ inputs.release_sha }}
        run: |
          set -euo pipefail
          if [[ "$OPERATION" == deploy ]]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
            git fetch --no-tags origin main --depth=1
            test "$(git rev-parse HEAD)" = "$REQUESTED_SHA"
            test "$(git rev-parse origin/main)" = "$REQUESTED_SHA"
            echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify successful CI run for exact main SHA
        if: ${{ inputs.operation == 'deploy' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          runs="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&head_sha=${RELEASE_SHA}&status=completed&per_page=100")"
          test "$(jq --arg sha "$RELEASE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")] | length' <<< "$runs")" -gt 0

      - name: Validate local Render Blueprint policy
        run: bash ops/scripts/validate-render-blueprint.sh

      - name: Install Render CLI 2.22.0
        env:
          RENDER_CLI_SHA256: 6cdcd11897b7bd7e673317e6f4aaf041b654d818444f3b1efec7240a835f79ec
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cli_2.22.0_linux_amd64.zip"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/render-oss/cli/releases/download/v2.22.0/cli_2.22.0_linux_amd64.zip
          printf '%s  %s\n' "$RENDER_CLI_SHA256" "$archive" | sha256sum --check --status
          unzip -q "$archive" -d "$RUNNER_TEMP/render-cli"
          install -m 0755 "$RUNNER_TEMP/render-cli/cli_v2.22.0" "$RUNNER_TEMP/render"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Validate Render Blueprint with official CLI
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_WORKSPACE_ID: ${{ secrets.RENDER_WORKSPACE_ID }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$RENDER_WORKSPACE_ID"
          render blueprints validate ops/deploy/render.yaml --workspace "$RENDER_WORKSPACE_ID" -o json

      - name: Install pnpm
        if: ${{ inputs.operation == 'deploy' }}
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0

      - name: Setup Node.js
        if: ${{ inputs.operation == 'deploy' }}
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install workspace dependencies
        if: ${{ inputs.operation == 'deploy' }}
        run: pnpm install --frozen-lockfile

      - name: Apply production database migrations
        if: ${{ inputs.operation == 'deploy' }}
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          test -n "$DIRECT_URL"
          pnpm --filter @varta/server exec prisma migrate deploy
          pnpm --filter @varta/server exec prisma migrate status

      - name: Deploy exact CI-approved commit
        if: ${{ inputs.operation == 'deploy' }}
        env:
          API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}
          CLIENT_DEPLOY_HOOK: ${{ secrets.RENDER_CLIENT_DEPLOY_HOOK }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          test -n "$API_DEPLOY_HOOK"
          test -n "$CLIENT_DEPLOY_HOOK"
          curl --fail --silent --show-error --request POST "${API_DEPLOY_HOOK}?ref=${RELEASE_SHA}"
          curl --fail --silent --show-error --request POST "${CLIENT_DEPLOY_HOOK}?ref=${RELEASE_SHA}"

      - name: Roll back to retained Render artifacts
        if: ${{ inputs.operation == 'rollback' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          API_SERVICE_ID: ${{ secrets.RENDER_API_SERVICE_ID }}
          CLIENT_SERVICE_ID: ${{ secrets.RENDER_CLIENT_SERVICE_ID }}
          API_DEPLOY_ID: ${{ inputs.api_deploy_id }}
          CLIENT_DEPLOY_ID: ${{ inputs.client_deploy_id }}
        run: |
          set -euo pipefail
          test -n "$RENDER_API_KEY"
          test -n "$API_SERVICE_ID"
          test -n "$CLIENT_SERVICE_ID"
          [[ "$API_DEPLOY_ID" =~ ^dep-[A-Za-z0-9]+$ ]]
          [[ "$CLIENT_DEPLOY_ID" =~ ^dep-[A-Za-z0-9]+$ ]]
          curl --fail --silent --show-error --request POST \
            "https://api.render.com/v1/services/${API_SERVICE_ID}/rollback" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "{\"deployId\":\"${API_DEPLOY_ID}\"}"
          curl --fail --silent --show-error --request POST \
            "https://api.render.com/v1/services/${CLIENT_SERVICE_ID}/rollback" \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data "{\"deployId\":\"${CLIENT_DEPLOY_ID}\"}"

      - name: Post-release smoke gates
        env:
          API_HEALTH_URL: ${{ secrets.RENDER_API_HEALTH_URL }}
          CLIENT_HEALTH_URL: ${{ secrets.RENDER_CLIENT_HEALTH_URL }}
        run: |
          set -euo pipefail
          test -n "$API_HEALTH_URL"
          test -n "$CLIENT_HEALTH_URL"
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors "$API_HEALTH_URL/api/health/combined/ready"
          curl --fail --silent --show-error --retry 30 --retry-delay 10 --retry-all-errors "$CLIENT_HEALTH_URL/"

      - name: Record release manifest
        env:
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          API_DEPLOY_ID: ${{ inputs.api_deploy_id }}
          CLIENT_DEPLOY_ID: ${{ inputs.client_deploy_id }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          node ops/scripts/write-release-manifest.mjs artifacts/release-manifest.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-manifest-${{ github.run_id }}
          path: artifacts/release-manifest.json
          retention-days: 90
