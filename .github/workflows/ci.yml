name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'pnpm'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Prisma generates the TypeScript client from schema.prisma.
      # Must run before typechecking since modules import from @prisma/client.
      - name: Generate Prisma client
        run: pnpm --filter @varta/server exec prisma generate

      - name: Lint client
        run: pnpm --filter @varta/web lint

      - name: Typecheck client
        run: pnpm --filter @varta/web typecheck

      - name: Build client
        run: pnpm --filter @varta/web build

      - name: Lint server
        run: pnpm --filter @varta/server lint

      - name: Typecheck server
        run: pnpm --filter @varta/server typecheck

      - name: Test server
        run: pnpm --filter @varta/server test

      - name: Build server
        run: pnpm --filter @varta/server build

      - name: Validate Compose configuration
        env:
          JWT_ACCESS_SECRET: 'ci-access-secret-at-least-32-characters'
          JWT_REFRESH_SECRET: 'ci-refresh-secret-at-least-32-characters'
          JWT_WS_SECRET: 'ci-websocket-secret-at-least-32-characters'
          METRICS_AUTH_TOKEN: 'ci-metrics-token-at-least-32-characters'
          ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef'
          METRICS_AUTH_TOKEN_FILE: '/tmp/varta-ci-metrics-token'
        run: |
          touch "$METRICS_AUTH_TOKEN_FILE"
          docker compose -f ops/compose/compose.yaml config --quiet

      - name: Build server image
        run: docker build -f ops/docker/server.Dockerfile .

      - name: Build client image
        run: docker build -f ops/docker/client.Dockerfile .
